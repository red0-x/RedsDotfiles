# ============================================================
# tmux config — keyboard-only workflow
# ============================================================

# ---- prefix: Ctrl+a (easier than Ctrl+b) ----
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ---- shell ----
set -g default-shell /usr/bin/zsh
set -g default-command /usr/bin/zsh

# ---- general ----
set -g mouse on                 # click panes, drag borders, scroll
set -sg escape-time 10          # no esc lag in vim/kitty
set -g base-index 1             # windows start at 1
setw -g pane-base-index 1       # panes start at 1
set -g renumber-windows on      # keep window numbers gapless
set -g history-limit 50000
set -g focus-events on          # nvim autoread, etc.
set -ga terminal-overrides ",xterm-256color:Tc"  # truecolor

# ---- reload conf: prefix + r ----
bind r source-file ~/.tmux.conf \; display "reloaded"

# ---- easy new windows / navigation (no prefix needed) ----
bind -n M-c new-window -c "#{pane_current_path}"
bind -n M-] next-window
bind -n M-[ previous-window
bind -n M-\; last-window
bind -n M-1 if-shell 'tmux select-window -t :1' '' 'new-window -t :1 -c "#{pane_current_path}"'
bind -n M-2 if-shell 'tmux select-window -t :2' '' 'new-window -t :2 -c "#{pane_current_path}"'
bind -n M-3 if-shell 'tmux select-window -t :3' '' 'new-window -t :3 -c "#{pane_current_path}"'
bind -n M-4 if-shell 'tmux select-window -t :4' '' 'new-window -t :4 -c "#{pane_current_path}"'
bind -n M-5 if-shell 'tmux select-window -t :5' '' 'new-window -t :5 -c "#{pane_current_path}"'
bind -n M-6 if-shell 'tmux select-window -t :6' '' 'new-window -t :6 -c "#{pane_current_path}"'
bind -n M-7 if-shell 'tmux select-window -t :7' '' 'new-window -t :7 -c "#{pane_current_path}"'
bind -n M-8 if-shell 'tmux select-window -t :8' '' 'new-window -t :8 -c "#{pane_current_path}"'
bind -n M-9 if-shell 'tmux select-window -t :9' '' 'new-window -t :9 -c "#{pane_current_path}"'
bind -n M-0 if-shell 'tmux select-window -t :10' '' 'new-window -t :10 -c "#{pane_current_path}"'
bind -n M-w choose-tree -Zw
bind -n M-q kill-pane

# ---- intuitive splits, keep cwd ----
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ---- pane resize (prefix + H/J/K/L, repeatable) ----
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---- vi copy-mode ----
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ============================================================
# plugins (TPM) — prefix + I to install, prefix + U to update
# ============================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'   # Ctrl+h/j/k/l across nvim<->tmux
set -g @plugin 'tmux-plugins/tmux-resurrect'      # save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'      # auto-save every 15m + restore on start

# resurrect/continuum
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ---- keep this at very bottom ----
run '~/.tmux/plugins/tpm/tpm'


# ============================================================
# everforest "glass pill" status bar  (matches waybar theme)
# ============================================================

set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#d3c6aa"
set -g status-left-length 120
set -g status-right-length 160

# rounded pills:  = U+E0B6 left half-circle,  = U+E0B4 right half-circle
set -g status-left "#[fg=#a7c080]#[bg=#a7c080,fg=#2d353b,bold] #S #[bg=default,fg=#a7c080]#[default] "

set -g status-right "#[fg=#343f44]#[bg=#343f44,fg=#859289] #{b:pane_current_path} #[bg=#343f44,fg=#3d484d]|#[bg=#343f44,fg=#7fbbb3] #h #[bg=default,fg=#343f44]#[default] #[fg=#343f44]#[bg=#343f44,fg=#dbbc7f] %H:%M #[bg=default,fg=#343f44]#[default] "

setw -g window-status-separator " "
setw -g window-status-format "#[fg=#232a2e]#[bg=#232a2e,fg=#859289] #I #W #[bg=default,fg=#232a2e]#[default]"
setw -g window-status-current-format "#[fg=#3d484d]#[bg=#3d484d,fg=#a7c080,bold] #I #W #[bg=default,fg=#3d484d]#[default]"
setw -g window-status-activity-style "fg=#dbbc7f"
setw -g window-status-bell-style "fg=#dbbc7f"

set -g pane-border-style "fg=#3d484d"
set -g pane-active-border-style "fg=#a7c080"
set -g pane-border-lines heavy
set -g message-style "bg=#343f44,fg=#d3c6aa"
set -g message-command-style "bg=#343f44,fg=#d3c6aa"
set -g mode-style "bg=#a7c080,fg=#2d353b"
set -g display-panes-active-colour "#a7c080"
set -g display-panes-colour "#859289"
set -g clock-mode-colour "#a7c080"
