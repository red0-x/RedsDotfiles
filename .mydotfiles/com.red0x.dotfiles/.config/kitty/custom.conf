shell $HOME/.local/bin/kitty-tmux

# tmux draws the themed rounded bar on top, so hide kitty's own tab bar
# and let alt+<n>/alt+t/alt+w/alt+j fall through to tmux window bindings.
tab_bar_style hidden

map shift+enter send_text all \e\r

# Vega 10 stability: avoid transparency and animated cursor GPU passes.
background_opacity 1
dynamic_background_opacity no
background_blur 0
cursor_trail 0
