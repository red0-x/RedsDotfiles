## cava for the island pill (raw ascii values, ';' separated)
[general]
bars = 12
framerate = 60
autosens = 1
sensitivity = 110
lower_cutoff_freq = 60
higher_cutoff_freq = 12000
[input]
method = pulse
source = auto
[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
[color]
background = default
foreground = default
