# -----------------------------------------------------
# Everforest Glass — borders & layout
# Palette: sainnhe/everforest dark medium
# -----------------------------------------------------

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2

    # active = Everforest green → aqua gradient, 45deg
    col.active_border = rgba(a7c080ee) rgba(83c092cc) rgba(7fbbb3aa) 45deg

    # inactive = dim Everforest bg3 (almost invisible, gummy edge)
    col.inactive_border = rgba(2d353b88)

    layout = dwindle
    resize_on_border = true
    extend_border_grab_area = 8
    hover_icon_on_border = true
}
