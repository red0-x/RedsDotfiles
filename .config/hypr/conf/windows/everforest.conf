# -----------------------------------------------------
# Everforest Glass — borders & layout
# Palette: sainnhe/everforest dark medium
# -----------------------------------------------------

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2

    # active = accent → aqua → blue gradient, 45deg ($ef_* from colors-rice.conf,
    # generated per-wallpaper by scripts/wallcolors.py)
    col.active_border = $rice_active_border

    # inactive = dim bg (almost invisible, gummy edge)
    col.inactive_border = $rice_inactive_border

    layout = dwindle
    resize_on_border = true
    extend_border_grab_area = 8
    hover_icon_on_border = true
}
