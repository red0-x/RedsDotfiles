# Additional portable rice configuration. Host GPU, monitor, power, and
# authentication settings stay in each machine's local configuration.

# No Hardware Cursor
# cursor {
#     no_hardware_cursors = false
# }

# Blur for waybar
#layerrule = blur, waybar

# Uncomment in case you have issues with screensharing
# exec-once = ~/.config/hypr/scripts/xdg.sh

render {
    direct_scanout = true
}

# hyprexpo is optional and not required by this rice.
plugin {
    # Everforest inner rim — gummy double border
    borders-plus-plus {
        add_borders = 2
        col.border_1 = $rice_rim_inner
        border_size_1 = 1
        col.border_2 = $rice_rim_outer
        border_size_2 = 2
        natural_rounding = yes
    }
}

# Display window — big-clock + cava + yazi
bind = $mainMod, F12, exec, kitty --class=display-window --start-as=fullscreen --session ~/.config/kitty/display.session

# Glass rice: frosted see-through apps (active inactive)
windowrule = opacity 0.85 0.78, class:^([Dd]iscord)$
windowrule = opacity 0.88 0.80, class:^(md\.obsidian\.Obsidian|obsidian)$
windowrule = opacity 0.88 0.80, class:^([Ss]potify)$
windowrule = opacity 0.90 0.82, class:^([Ss]lack|com\.slack\.Slack)$
windowrule = float, class:^(com\.slack\.Slack)$, title:^[^(\[]* - Slack$
windowrule = size 600 380, class:^(com\.slack\.Slack)$, title:^[^(\[]* - Slack$
windowrule = move 100%-620 60, class:^(com\.slack\.Slack)$, title:^[^(\[]* - Slack$
windowrule = opacity 0.92 0.85, class:^([Ss]team)$, title:^(Steam|Friends List)$
windowrule = opacity 0.90 0.82, class:^(GitHub Desktop|github desktop)$
windowrule = opacity 0.96 0.90, class:^(brave-browser)$
windowrule = opaque, class:^(brave-browser)$, fullscreen:1

# App thinks fullscreen while the window stays tiled
bind = SUPER SHIFT, F, fullscreenstate, 0 3

# quickshell-overview (Super+Tab), replaces default next/prev workspace binds
exec-once = qs -c overview
unbind = $mainMod, Tab
unbind = $mainMod SHIFT, Tab
bind = $mainMod, Tab, exec, qs ipc -c overview call overview cycle
bind = $mainMod SHIFT, Tab, exec, qs ipc -c overview call overview cycleBack
layerrule = blur, quickshell:overview-blur
layerrule = ignorezero, quickshell:overview-blur
layerrule = blur, rofi
layerrule = ignorezero, rofi

# Dynamic island, controlled by the Waybar chips
exec-once = qs -c island
layerrule = blur, quickshell:island
layerrule = ignorezero, quickshell:island

# Discord starts minimized so RpcBridge can feed the Waybar/island chip
exec-once = discord --start-minimized

# Super+Q closes an open island first, otherwise kills the active window
unbind = $mainMod, Q
bind = $mainMod, Q, exec, ~/.config/hypr/scripts/island-or-kill.sh

# Desktop notification feed for the Quickshell toast overlay
exec-once = python3 ~/.config/quickshell/island/notify-watch.py
layerrule = blur, quickshell:toasts
layerrule = ignorezero, quickshell:toasts
