# Add your additional Hyprland configurations here
#
# This is an additional key binding
# bind = $mainMod CTRL, up, workspace, empty
#
# Example for xwayland
# xwayland {
#   force_zero_scaling = true
# }

# Unique to custom — duplicates of nvidia.conf removed
# NOTE: do NOT use /dev/dri/by-path/... here. Aquamarine splits this list on ':'
# and PCI paths contain colons, so it shatters the path and finds no GPU (crash).
# Must be the plain cardN node.
env = AQ_DRM_DEVICES,/dev/dri/card2
env = WLR_DRM_DEVICES,/dev/dri/card2
env = NVD_BACKEND,direct

# No Hardware Cursor
# cursor {
#     no_hardware_cursors = false
# }

# Blur for waybar
#layerrule = blur, waybar

# Uncomment in case you have issues with screensharing
# exec-once = ~/.config/hypr/scripts/xdg.sh

render {
    direct_scanout = true
}

# hyprexpo plugin
plugin {
    hyprexpo {
        columns = 3
        gap_size = 5
        bg_col = rgb(111111)
        workspace_method = center current
        enable_gesture = true
        gesture_fingers = 3
        gesture_distance = 300
        gesture_positive = true
    }

    # Everforest inner rim — gummy double border
    borders-plus-plus {
        add_borders = 2

        # inner rim: aqua glow tight against window
        col.border_1 = $rice_rim_inner
        border_size_1 = 1

        # spacer rim: dim bg for separation
        col.border_2 = $rice_rim_outer
        border_size_2 = 2

        natural_rounding = yes
    }
}

bind = $mainMod, grave, hyprexpo:expo, toggle

# -----------------------------------------------------
# Display window — big-clock + cava + yazi
# -----------------------------------------------------
bind = $mainMod, F12, exec, kitty --class=display-window --start-as=fullscreen --session ~/.config/kitty/display.session

# -----------------------------------------------------
# kicad-wakatime — Hackatime time tracking for KiCad
# -----------------------------------------------------
exec-once = ~/.local/bin/kicad-wakatime

# voice dictation toggle
bind = SUPER, D, exec, voice-dictate

# kdeconnect daemon
exec-once = /usr/bin/kdeconnectd

# -----------------------------------------------------
# IME — ibus Chinese Pinyin, Alt+Shift+C toggles us<->cn
# -----------------------------------------------------
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
exec-once = dbus-update-activation-environment --systemd GTK_IM_MODULE QT_IM_MODULE XMODIFIERS
exec-once = fcitx5 -d --replace
bind = ALT SHIFT, C, exec, ~/.config/hypr/scripts/ime-toggle.sh

# -----------------------------------------------------
# Discord — see-through to desktop (Evergreen theme)
# Electron's window is opaque at the OS level, so the theme CSS alone can
# never show the wallpaper. This is the piece that actually does it.
# Blur already applies (decoration blur has ignore_opacity = true).
# Lower the numbers for more transparency; 1.0 1.0 disables.
# -----------------------------------------------------
windowrule = opacity 0.85 0.78, class:^([Dd]iscord)$

# --- Glass rice: frosted see-through for other apps (active inactive) ---
windowrule = opacity 0.88 0.80, class:^(md\.obsidian\.Obsidian|obsidian)$
windowrule = opacity 0.88 0.80, class:^([Ss]potify)$
windowrule = opacity 0.90 0.82, class:^([Ss]lack|com\.slack\.Slack)$
windowrule = opacity 0.92 0.85, class:^([Ss]team)$, title:^(Steam|Friends List)$
windowrule = opacity 0.90 0.82, class:^(GitHub Desktop|github desktop)$
# Brave: opacity hits the whole window (Chromium can't split UI vs page),
# so keep it barely-there to keep pages readable. Fullscreen stays solid.
windowrule = opacity 0.96 0.90, class:^(brave-browser)$
windowrule = opaque, class:^(brave-browser)$, fullscreen:1

# --- Descenders (Unity 2017 + XWayland) fullscreen fix ---
# Unity fights the tiler over window size; force it fullscreen & unmanaged.
windowrule = fullscreen, class:^(Descenders\.x86_64)$
windowrule = monitor HDMI-A-4, class:^(Descenders\.x86_64)$
windowrule = noblur, class:^(Descenders\.x86_64)$
windowrule = immediate, class:^(Descenders\.x86_64)$
windowrule = idleinhibit always, class:^(Descenders\.x86_64)$
