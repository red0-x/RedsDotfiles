# -----------------------------------------------------
# Window rules
# -----------------------------------------------------

windowrule[tile = true] = title:^(Microsoft-edge)$
windowrule[tile = true] = title:^(Brave-browser)$
windowrule[tile = true] = title:^(Chromium)$
windowrule[float = true] = title:^(pavucontrol)$
windowrule[float = true] = title:^(blueman-manager)$
windowrule[float = true] = title:^(nm-connection-editor)$
windowrule[float = true] = title:^(qalculate-gtk)$

# Browser Picture in Picture
windowrule[float = true] = title:^(Picture-in-Picture)$
windowrule[pin = true] = title:^(Picture-in-Picture)$
windowrule[move = 69.5% 4%] = title:^(Picture-in-Picture)$

# idleinhibit
windowrule[idleinhibit = fullscreen] = class:([window]) # Available modes: none, always, focus, fullscreen

#xwayland related rules
# when moving objects in resolve a large border is produced
# This rule prevents that and serves as a template for any problematic xwayland apps
windowrule[noblur = true] = class:^(\bresolve\b)$, xwayland:1
# This is a general rule for xwayland apps but can have other consequences
# for one user it impacted EMACs so it's disabled by default
# It's here as a reference or for quick triage of xwayland apps
#windowrule[noblur = true] = xwayland:1
