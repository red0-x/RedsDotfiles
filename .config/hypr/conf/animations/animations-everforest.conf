# -----------------------------------------------------
# Everforest — fast, gummy, non-disruptive animations
# durations in deciseconds (1ds = 100ms)
# -----------------------------------------------------

animations {
    enabled = true

    # bezier curves
    bezier = linear,        0.0, 0.0, 1.0, 1.0
    bezier = ef_decel,      0.05, 0.7, 0.1, 1.0     # snappy ease-out
    bezier = ef_pop,        0.2,  0.9, 0.25, 1.05   # slight overshoot (gummy)
    bezier = ef_smooth,     0.16, 1.0, 0.3, 1.0     # iOS-style ease-out
    bezier = ef_quick,      0.25, 0.1, 0.25, 1.0    # crisp

    # windows: 200ms popin with subtle bounce
    animation = windows,         1, 2.0, ef_pop,    popin 85%
    animation = windowsIn,       1, 2.0, ef_pop,    popin 85%
    animation = windowsOut,      1, 1.8, ef_decel,  popin 92%
    animation = windowsMove,     1, 2.5, ef_smooth

    # layers (waybar, walker, swaync) — quick fade slide
    animation = layers,          1, 2.0, ef_decel,  fade
    animation = layersIn,        1, 2.0, ef_decel,  fade
    animation = layersOut,       1, 1.5, ef_decel,  fade

    # borders — color crossfade fast enough to feel reactive
    animation = border,          1, 6,   ef_smooth
    animation = borderangle,     1, 30,  linear, loop

    # fades — minimal, near-instant
    animation = fade,            1, 1.5, ef_decel
    animation = fadeIn,          1, 1.5, ef_decel
    animation = fadeOut,         1, 1.5, ef_decel
    animation = fadeSwitch,      1, 1.5, ef_decel
    animation = fadeShadow,      1, 1.5, ef_decel
    animation = fadeDim,         1, 1.5, ef_decel

    # workspace switching — 250ms slide
    animation = workspaces,      1, 2.5, ef_smooth, slide
    animation = specialWorkspace,1, 2.0, ef_decel,  slidevert
}
