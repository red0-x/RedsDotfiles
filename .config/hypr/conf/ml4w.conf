# Pavucontrol floating
windowrule[float = true] = class:(.*org.pulseaudio.pavucontrol.*)
windowrule[size = 700 600] = class:(.*org.pulseaudio.pavucontrol.*)
windowrule[center = true] = class:(.*org.pulseaudio.pavucontrol.*)
windowrule[pin = true] = class:(.*org.pulseaudio.pavucontrol.*)

# OpenAI ChatGPT floating
windowrule[float = true] = title:(ChatGPT.*)
windowrule[float = true] = title:(.*chat.openai.com.*)
windowrule[size = 500 50%] = title:(.*chat.openai.com.*)
windowrule[move = 20 70] = title:(.*chat.openai.com.*)

# Waypaper
windowrule[float = true] = class:(.*waypaper.*)
windowrule[size = 900 700] = class:(.*waypaper.*)
windowrule[center = true] = class:(.*waypaper.*)
windowrule[pin = true] = class:(.*waypaper.*)

# SwayNC
layerrule[blur = true] = swaync-control-center
layerrule[blur = true] = swaync-notification-window
layerrule[xray = true] = swaync-control-center
layerrule[xray = true] = swaync-notification-window
layerrule[ignore_alpha = 0.5] = swaync-control-center
layerrule[ignore_alpha = 0.5] = swaync-notification-window

# Newelle
windowrule[float = true] = class:(io.github.qwersyk.Newelle)
windowrule[size = 1000 700] = class:(io.github.qwersyk.Newelle)
windowrule[center = true] = class:(io.github.qwersyk.Newelle)
windowrule[pin = true] = class:(io.github.qwersyk.Newelle)

# ML4W Calendar floating
windowrule[float = true] = class:(com.ml4w.calendar)
windowrule[move = 100%-w-16 66] = class:(com.ml4w.calendar)
windowrule[pin = true] = class:(com.ml4w.calendar)
windowrule[size = 400 400] = class:(com.ml4w.calendar)

# ML4W Sidebar floating
windowrule[float = true] = class:(com.ml4w.sidebar)
windowrule[move = 100%-w-16 66] = class:(com.ml4w.sidebar)
windowrule[pin = true] = class:(com.ml4w.sidebar)
windowrule[size = 400 660] = class:(com.ml4w.sidebar)

# ML4W Welcome App floating
windowrule[float = true] = class:(com.ml4w.welcome)
windowrule[size = 700 600] = class:(com.ml4w.welcome)
windowrule[center = true] = class:(com.ml4w.welcome)
windowrule[pin = true] = class:(com.ml4w.welcome)

# ML4W Settings App floating
windowrule[float = true] = class:(com.ml4w.settings)
windowrule[size = 800 600] = class:(com.ml4w.settings)
windowrule[move = 10% 20%] = class:(com.ml4w.settings)

# Blueman Manager
windowrule[float = true] = class:(blueman-manager)
windowrule[size = 800 600] = class:(blueman-manager)
windowrule[center = true] = class:(blueman-manager)

# nwg-look
windowrule[float = true] = class:(nwg-look)
windowrule[size = 700 600] = class:(nwg-look)
windowrule[move = 10% 20%] = class:(nwg-look)
windowrule[pin = true] = class:(nwg-look)

# nwg-displays
windowrule[float = true] = class:(nwg-displays)
windowrule[size = 900 600] = class:(nwg-displays)
windowrule[move = 10% 20%] = class:(nwg-displays)
windowrule[pin = true] = class:(nwg-displays)

# System Mission Center
windowrule[float = true] = class:(io.missioncenter.MissionCenter)
windowrule[pin = true] = class:(io.missioncenter.MissionCenter)
windowrule[center = true] = class:(io.missioncenter.MissionCenter)
windowrule[size = 900 600] = class:(io.missioncenter.MissionCenter)

# System Mission Center Preference Window
windowrule[float = true] = class:(missioncenter), title:^(Preferences)$
windowrule[pin = true] = class:(missioncenter), title:^(Preferences)$
windowrule[center = true] = class:(missioncenter), title:^(Preferences)$

# Gnome Calculator
windowrule[float = true] = class:(org.gnome.Calculator)
windowrule[size = 700 600] = class:(org.gnome.Calculator)
windowrule[center = true] = class:(org.gnome.Calculator)

# Hyprland Share Picker
windowrule[float = true] = class:(hyprland-share-picker)
windowrule[pin = true] = class:(hyprland-share-picker)
windowrule[center = true] = class:(hyprland-share-picker)
windowrule[size = 600 400] = class:(hyprland-share-picker)

# General floating
windowrule[float = true] = class:(dotfiles-floating)
windowrule[size = 1000 700] = class:(dotfiles-floating)
windowrule[center = true] = class:(dotfiles-floating)

# Dotfiles Sidepad
windowrule[float = true] = class:(dotfiles-sidepad)
windowrule[size = 1000 700] = class:(dotfiles-sidepad)
windowrule[center = true] = class:(dotfiles-sidepad)
windowrule[pin = true] = class:(dotfiles-sidepad)

# Float and center file pickers
windowrule[float = true] = class:xdg-desktop-portal-gtk, title:^(Open.*Files?|Save.*Files?|All Files|Save)
windowrule[center = true] = class:xdg-desktop-portal-gtk, title:^(Open.*Files?|Save.*Files?|All Files|Save)

# XDG Desktop Portal
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# QT
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

# GDK
env = GDK_SCALE,1

# Toolkit Backend
env = GDK_BACKEND,wayland,x11,*
env = CLUTTER_BACKEND,wayland

# Mozilla
env = MOZ_ENABLE_WAYLAND,1

# Set the cursor size for xcursor
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Ozone
env = OZONE_PLATFORM,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,wayland

# XWayland
xwayland {
  force_zero_scaling = true
}
