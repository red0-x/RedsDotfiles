# -----------------------------------------------------
# Everforest Glass — window decoration
# rounded corners + frosted blur + soft gummy shadow
# -----------------------------------------------------

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        # Keep the glass look with less work for the integrated Vega GPU.
        size = 3
        passes = 1
        new_optimizations = true
        ignore_opacity = true
        xray = false
        noise = 0.012
        contrast = 1.05
        brightness = 1.0
        vibrancy = 0.20
        vibrancy_darkness = 0.10
        popups = true
        popups_ignorealpha = 0.2
    }

    shadow {
        enabled = true
        range = 12
        render_power = 3
        sharp = false
        color = 0x55000000
        color_inactive = 0x33000000
        offset = 0 4
        scale = 1.0
    }

    dim_inactive = false
    dim_strength = 0.10
}

# blur waybar and other shell layers (matches glass bar)
layerrule[blur = true] = waybar
layerrule[xray = true] = waybar
layerrule[blur = true] = swaync-notification-window
layerrule[blur = true] = swaync-control-center
layerrule[blur = true] = walker
layerrule[xray = true] = walker
layerrule[blur = true] = logout_dialog
