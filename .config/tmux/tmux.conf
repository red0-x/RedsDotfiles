# Everforest, rounded status bar. Matches the nvim/kitty theme.

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-kitty:Tc"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g history-limit 50000
set -g focus-events on
set -g set-clipboard on

# splits that keep the cwd, and intuitive keys
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

set -g status-position bottom
set -g status-interval 5
set -g status-justify centre
set -g status-style "bg=default fg=#d3c6aa"

set -g status-left-length 40
set -g status-right-length 60
set -g status-left "#[fg=#2b3339,bg=#a7c080,bold] #S #[fg=#a7c080,bg=default]#[default] "
set -g status-right "#[fg=#859289]#{?client_prefix,#[fg=#e69875]prefix ,}#[fg=#83c092,bg=default]#[fg=#2b3339,bg=#83c092] #h #[fg=#83c092,bg=default]#[default]"

# rounded window pills
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#323c41,bg=default]#[fg=#859289,bg=#323c41] #I #W #[fg=#323c41,bg=default]#[default]"
setw -g window-status-current-format "#[fg=#a7c080,bg=default]#[fg=#2b3339,bg=#a7c080,bold] #I #W #[fg=#a7c080,bg=default]#[default]"
setw -g window-status-activity-style "fg=#e69875"

set -g pane-border-lines rounded
set -g pane-border-style "fg=#323c41"
set -g pane-active-border-style "fg=#a7c080"
set -g pane-border-status off

set -g message-style "bg=#323c41 fg=#d3c6aa"
set -g mode-style "bg=#a7c080 fg=#2b3339"
set -g display-panes-active-colour "#a7c080"
set -g display-panes-colour "#859289"
setw -g clock-mode-colour "#a7c080"
